<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Voice Harness — Sign in</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px; padding: 28px;
    background: #161b22; border: 1px solid #30363d; border-radius: 14px;
  }
  h1 { font-size: 17px; margin-bottom: 4px; }
  p.sub { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 12.5px; color: #8b949e; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 15px;
    background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; outline: none;
  }
  input:focus { border-color: #3fb950; }
  button {
    width: 100%; margin-top: 14px; padding: 10px 12px; font-size: 14.5px; font-weight: 600;
    background: #238636; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { margin-top: 12px; font-size: 13px; color: #ffa198; min-height: 20px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Voice Harness</h1>
    <p class="sub">Enter the password you set on the PC.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
<script>
  const form = document.getElementById('f');
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  const err = document.getElementById('err');
  // Open-redirect guard: only same-origin absolute paths are honoured.
  const rawNext = new URLSearchParams(location.search).get('next') || '/desktop/';
  const next = /^\/[^/\\]/.test(rawNext) ? rawNext : '/desktop/';
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
      location.replace(next);
    } catch (ex) {
      err.textContent = ex.message;
      go.disabled = false;
      pw.select();
    }
  });
</script>
</body>
</html>
